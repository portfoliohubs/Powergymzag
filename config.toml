baseURL = 'https://portfoliohubs.github.io/Powergymzag/'
languageCode = 'en-us'
title = 'Gym Training System'

[params]
  gym_name = "Elite Fitness Training"
  slogan = "Transform Your Body, Elevate Your Life"
  default_theme = "light"
  default_gender = "male"

[images]
  [images.chest]
    barbell_bench_press = ""
    dumbbell_fly = ""
    cable_fly = ""
    machine_chest_press = ""
  
  [images.back]
    pull_ups = ""
    bent_over_rows = ""
    lat_pulldown = ""
    seated_cable_rows = ""
  
  [images.shoulders]
    overhead_press = ""
    lateral_raises = ""
    front_raises = ""
    shoulder_press_machine = ""
  
  [images.arms]
    bicep_curls = ""
    tricep_pushdowns = ""
    hammer_curls = ""
    skull_crushers = ""
  
  [images.legs]
    squats = ""
    deadlifts = ""
    leg_press = ""
    leg_curls = ""
    lunges = ""
  
  [images.core]
    planks = ""
    crunches = ""
    leg_raises = ""
    russian_twists = ""

[training_programs]
  [training_programs.push_pull_legs]
    push = { name = "Push", description = "Chest, Shoulders, Triceps" }
    pull = { name = "Pull", description = "Back, Biceps" }
    legs = { name = "Legs", description = "Quads, Hamstrings, Glutes, Calves" }
  
  [training_programs.body_parts]
    chest = { name = "Chest", description = "Upper body pushing muscles" }
    back = { name = "Back", description = "Upper body pulling muscles" }
    shoulders = { name = "Shoulders", description = "Deltoid muscles" }
    
    [training_programs.body_parts.arms]
    name = "Arms"
    description = "Biceps and Triceps"
    
    [training_programs.body_parts.arms.sub_parts]
      [training_programs.body_parts.arms.sub_parts.biceps]
      name = "Biceps"
      description = "Arm flexors"
      
      [training_programs.body_parts.arms.sub_parts.triceps]
      name = "Triceps"
      description = "Arm extensors"
    
    legs = { name = "Legs", description = "Lower body muscles" }
    core = { name = "Core", description = "Abdominal and stabilizing muscles" }

