baseURL = "https://github.com/portfoliohubs/Powergymzag/"
languageCode = "en-us"
title = "Gym Training"
relativeURLs = true

[params]
  gym_name = "IronPulse Gym"
  slogan = "Train smart. Lift strong. Repeat."
  cta_text = "Explore Training"
  default_theme = "dark"
  default_gender = "male"

  [params.home]
    hero_cta_target = "#programs"

    [[params.home.sections]]
      id = "ppl"
      title = "Push / Pull / Legs"
      subtitle = "Structured programs for balanced progression"

      [[params.home.sections.items]]
        title = "Push"
        slug = "push"
        description = "Chest, shoulders, triceps"

      [[params.home.sections.items]]
        title = "Pull"
        slug = "pull"
        description = "Back, rear delts, biceps"

      [[params.home.sections.items]]
        title = "Legs"
        slug = "legs"
        description = "Quads, hamstrings, glutes, calves"

    [[params.home.sections]]
      id = "bodyparts"
      title = "Smart Body Parts"
      subtitle = "Pick a muscle focus and filter by equipment"

      [[params.home.sections.items]]
        title = "Chest"
        slug = "chest"
        description = "Pressing strength + hypertrophy"

      [[params.home.sections.items]]
        title = "Back"
        slug = "back"
        description = "Width, thickness, posture"

      [[params.home.sections.items]]
        title = "Shoulders"
        slug = "shoulders"
        description = "Delts in all angles"

      [[params.home.sections.items]]
        title = "Biceps"
        slug = "biceps"
        description = "Curl variations + control"

      [[params.home.sections.items]]
        title = "Triceps"
        slug = "triceps"
        description = "Pressdown + overhead work"

      [[params.home.sections.items]]
        title = "Legs"
        slug = "legs"
        description = "Lower body power"

      [[params.home.sections.items]]
        title = "Core"
        slug = "core"
        description = "Stability + anti-rotation"

  [params.labels]
    free_weights = "Free Weights"
    machines = "Machines"
    cables = "Cables"

  [params.images]
