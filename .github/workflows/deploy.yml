name: Deploy Hugo Site to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: '0.154.5'
        extended: true

    - name: Cache Hugo modules
      uses: actions/cache@v3
      with:
        path: /tmp/hugo_cache
        key: ${{ runner.os }}-hugo-${{ hashFiles('**/go.sum', '**/go.mod') }}
        restore-keys: |
          ${{ runner.os }}-hugo-

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Build with Hugo
      run: |
        export HUGO_CACHE_DIR=/tmp/hugo_cache
        hugo --minify --gc --enableGitInfo --logLevel info

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./public
        retention-days: 1

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
