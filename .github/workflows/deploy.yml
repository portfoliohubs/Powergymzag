name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.125.7'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Copy root index.html into public
        run: |
          cp ./index.html ./public/index.html

      - name: Generate site-config.json from config.toml
        run: |
          python -m pip install --upgrade pip
          python -m pip install tomli || true
          python - << 'PY'
          import json
          import pathlib
          try:
            import tomllib
          except Exception:
            import tomli as tomllib

          root = pathlib.Path('.').resolve()
          cfg_path = root / 'config.toml'
          with cfg_path.open('rb') as f:
            cfg = tomllib.load(f)

          out = root / 'public' / 'site-config.json'
          out.write_text(json.dumps(cfg, ensure_ascii=False), encoding='utf-8')
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
